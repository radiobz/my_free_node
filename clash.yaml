port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxy-providers:
  my-provider:
    type: http
    url: "https://cdn.jsdelivr.net/gh/radiobz/my_free_node@main/sub.txt"
    interval: 3600
    path: ./my-provider.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxy-groups:
  - name: "节点选择"
    type: select
    use:
      - my-provider
rules:
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
